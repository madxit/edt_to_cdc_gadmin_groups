[versions]
kotlin = "2.0.21"
compose = "1.7.0"
coroutines = "1.9.0"
serialization = "1.7.3"
google-admin-directory = "directory_v1-rev20240429-2.0.0"
google-auth = "1.24.0"
google-api-client = "2.4.0"
google-http-gson = "1.44.1"
google-groups-settings = "v1-rev20220614-2.0.0"
junit = "5.10.2"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

google-api-services-admin-directory = { module = "com.google.apis:google-api-services-admin-directory", version.ref = "google-admin-directory" }
google-api-services-groupssettings = { module = "com.google.apis:google-api-services-groupssettings", version.ref = "google-groups-settings" }
google-auth-library-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-auth" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "google-api-client" }
google-http-client-gson = { module = "com.google.http-client:google-http-client-gson", version.ref = "google-http-gson" }
apache-poi-ooxml = { module = "org.apache.poi:poi-ooxml", version = "5.3.0" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
